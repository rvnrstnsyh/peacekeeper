[package]
name = "sys"
authors = ["Rivane Rasetiansyah <re@nvll.me>"]
repository = "git+https://github.com/rvnrstnsyh/peacekeeper.git"
homepage = "https://github.com/rvnrstnsyh/peacekeeper"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"

[dependencies]
anyhow = "1.0"
dotenvy = "0.15.7"
prost = "0.14.3"
proto = "0.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tonic = "0.14.2"
tonic-prost = "0.14.2"
tonic-reflection = "0.14.2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.8.1"

[build-dependencies]
tonic-prost-build = "0.14.2"

[features]
default = []

[lints.clippy]
needless_return = "allow"
match-single-binding = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.test]
opt-level = 0
lto = true
codegen-units = 1
debug = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true
